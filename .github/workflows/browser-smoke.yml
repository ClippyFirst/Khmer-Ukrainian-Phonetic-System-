name: Khmer browser smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run deterministic web checks
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify visible results in Chromium
        run: npm run test:browser
