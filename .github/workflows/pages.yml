name: Deploy site to GitHub Pages

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run web checks
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test deployed site and runtime assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/system.html" -o /tmp/system.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/src/main.js" -o /tmp/main.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/src/styles/main.css" -o /tmp/styles.css
          grep -q 'id="source"' /tmp/index.html
          grep -q 'src="./src/main.js' /tmp/index.html
          grep -q '<title>' /tmp/system.html
          test -s /tmp/main.js && test -s /tmp/styles.css
